<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cantina Amadeu Olivério</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">Cantina Amadeu Olivério</div>
    </nav>

    <main class="container">

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% if mensagens %}
                {% for categoria, mensagem in mensagens %}
                    <div class="alerta alerta-{{ categoria }}">{{ mensagem }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="formulario-container" style="margin-top: 60px;">
            <h2 style="margin-bottom: 20px; color: var(--azul); font-size: 1.2rem;">Acesso ao Sistema</h2>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="campo-formulario">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" required autofocus>
                </div>

                <div class="campo-formulario">
                    <label for="senha">Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="senha" name="senha" required>
                        <button type="button" class="btn-olho" onclick="toggleSenha(this)">ver</button>
                    </div>
                </div>

                <button type="submit" class="btn-principal">Entrar</button>
            </form>

            <script>
            function toggleSenha(btn) {
                var input = document.getElementById('senha');
                if (input.type === 'password') {
                    input.type = 'text';
                    btn.textContent = 'ocultar';
                } else {
                    input.type = 'password';
                    btn.textContent = 'ver';
                }
            }
            </script>

        </div>

    </main>

    <footer class="rodape">
        <p>Cantina Amadeu Olivério</p>
    </footer>

</body>
</html>
