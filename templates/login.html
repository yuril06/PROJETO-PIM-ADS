<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cantina Escolar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">Cantina Escolar</div>
    </nav>

    <main class="container">

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% if mensagens %}
                {% for categoria, mensagem in mensagens %}
                    <div class="alerta alerta-{{ categoria }}">{{ mensagem }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="formulario-container" style="margin-top: 60px;">
            <h2 style="margin-bottom: 20px; color: var(--azul); font-size: 1.2rem;">Acesso ao Sistema</h2>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="campo-formulario">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" required autofocus>
                </div>

                <div class="campo-formulario">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required>
                </div>

                <button type="submit" class="btn-principal">Entrar</button>
            </form>
        </div>

    </main>

    <footer class="rodape">
        <p>Sistema de Controle de Estoque - Cantina Escolar | Projeto PIM - ADS 1 Semestre</p>
    </footer>

</body>
</html>
