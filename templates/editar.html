{% extends "base.html" %}

{% block titulo %}Editar Produto - Cantina Escolar{% endblock %}

{% block conteudo %}

<div class="cabecalho-pagina">
    <h1>Editar Produto</h1>
    <a href="{{ url_for('gerenciar_produtos') }}" class="btn-voltar">Voltar</a>
</div>

<div class="formulario-container">
    <form method="POST" action="{{ url_for('editar', produto_id=produto['id']) }}">

        <div class="campo-formulario">
            <label for="nome">Nome do Produto *</label>
            <input type="text" id="nome" name="nome"
                   value="{{ produto['nome'] }}" required maxlength="100">
        </div>

        <div class="campo-formulario">
            <label for="quantidade">Quantidade em Estoque *</label>
            <input type="number" id="quantidade" name="quantidade"
                   value="{{ produto['quantidade'] }}" min="0" required>
        </div>

        <div class="campo-formulario">
            <label for="preco">Preco Unitario (R$) *</label>
            <input type="number" id="preco" name="preco"
                   value="{{ produto['preco'] }}" step="0.01" min="0.01" required>
        </div>

        <div class="campo-formulario">
            <label for="estoque_minimo">Estoque Minimo *</label>
            <input type="number" id="estoque_minimo" name="estoque_minimo"
                   value="{{ produto['estoque_minimo'] }}" min="1" required>
        </div>

        <button type="submit" class="btn-principal">Salvar Alteracoes</button>

    </form>
</div>

{% endblock %}
