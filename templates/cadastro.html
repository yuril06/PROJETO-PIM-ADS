{% extends "base.html" %}

{% block titulo %}Cadastrar Produto — Cantina Escolar{% endblock %}

{% block conteudo %}

<!-- ===== CABEÇALHO ===== -->
<div class="cabecalho-pagina">
    <h1>➕ Cadastrar Novo Produto</h1>
    <a href="{{ url_for('painel') }}" class="btn-voltar">← Voltar ao Painel</a>
</div>

<!-- ===== FORMULÁRIO DE CADASTRO ===== -->
<div class="formulario-container">
    <form method="POST" action="{{ url_for('cadastro') }}">

        <!-- Campo: Nome do produto -->
        <div class="campo-formulario">
            <label for="nome">Nome do Produto *</label>
            <input type="text" id="nome" name="nome"
                   placeholder="Ex: Refrigerante Lata" required maxlength="100">
        </div>

        <!-- Campo: Quantidade inicial -->
        <div class="campo-formulario">
            <label for="quantidade">Quantidade Inicial *</label>
            <input type="number" id="quantidade" name="quantidade"
                   min="0" placeholder="Ex: 24" required>
        </div>

        <!-- Campo: Preço unitário -->
        <div class="campo-formulario">
            <label for="preco">Preço Unitário (R$) *</label>
            <input type="number" id="preco" name="preco"
                   step="0.01" min="0.01" placeholder="Ex: 4.50" required>
        </div>

        <!-- Campo: Estoque mínimo -->
        <div class="campo-formulario">
            <label for="estoque_minimo">Estoque Mínimo *</label>
            <input type="number" id="estoque_minimo" name="estoque_minimo"
                   min="1" placeholder="Ex: 5" required>
            <small>Quando atingir este valor, o sistema emite alerta e envia e-mail.</small>
        </div>

        <!-- Botão de envio -->
        <button type="submit" class="btn-principal">
            ✅ Cadastrar Produto
        </button>

    </form>
</div>

{% endblock %}
